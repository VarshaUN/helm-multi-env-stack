name: Helm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency update charts/app-stack

      - name: Helm lint
        run: helm lint charts/app-stack -f charts/app-stack/values-${{ matrix.env }}.yaml

      - name: Helm template
        run: helm template app-stack charts/app-stack -f charts/app-stack/values-${{ matrix.env }}.yaml