frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgresql:
  primary:
    persistence:
      enabled: true
      size: 1Gi
  auth:
    username: appuser
    database: appdb
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell